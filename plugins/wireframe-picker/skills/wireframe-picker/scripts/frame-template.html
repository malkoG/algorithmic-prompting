<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe Picker</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.95rem;
    background: #0e0e10;
    color: #eaeaea;
  }
  @media (prefers-color-scheme: light) {
    body { background: #f7f7f8; color: #1a1a1a; }
  }
  /* Type scale (~1.25-1.33 ratio per step): 0.75 / 0.95 / 1.2 / 1.5rem */
  h2 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  h3 { margin: 0; font-size: 1.2rem; }
  .subtitle { opacity: 0.7; margin: 0 0 1.5rem; }
  .section { margin-bottom: 1.5rem; }
  .label { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; opacity: 0.6; }

  .cards, .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1rem;
  }
  .card, .option {
    border: 2px solid rgba(128,128,128,0.3);
    border-radius: 10px;
    padding: 0;
    overflow: hidden;
    cursor: pointer;
    background: rgba(128,128,128,0.06);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .card:hover, .option:hover { border-color: rgba(90,140,255,0.6); }
  .card.selected, .option.selected { border-color: #5a8cff; box-shadow: 0 0 0 2px rgba(90,140,255,0.4); }
  .card-image img { width: 100%; display: block; }
  .card-body, .option .content { padding: 0.9rem 1rem; }
  .option { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.9rem 1rem; }
  .option .letter {
    font-weight: 700; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    background: rgba(90,140,255,0.2); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mockup { border: 1px solid rgba(128,128,128,0.3); border-radius: 8px; overflow: hidden; }
  .mockup-header { padding: 0.4rem 0.75rem; background: rgba(128,128,128,0.1); font-size: 0.75rem; opacity: 0.7; }
  .mockup-body { padding: 1rem; }
  .split { display: flex; gap: 1rem; }
  .split > * { flex: 1; }

  #spk-status {
    position: fixed; bottom: 0.75rem; right: 0.75rem;
    font-size: 0.75rem; padding: 0.3rem 0.6rem; border-radius: 6px;
    background: rgba(128,128,128,0.2); opacity: 0.7;
  }
</style>
</head>
<body>
{{CONTENT}}
<div id="spk-status">connecting…</div>
<script>{{HELPER_SCRIPT}}</script>
</body>
</html>
